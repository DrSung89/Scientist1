name: Calculator regression tests

on:
  push:
    branches: [main, survival-calculator-validation]
    paths:
      - "survival-calculator/main.js"
      - "tests/survival-calculator.test.js"
      - "chi-square-calculator/index.html"
      - "tests/chi-square-calculator.test.js"
      - "t-test-calculator/index.html"
      - "tests/t-test-calculator.test.js"
      - "molarity-calculator/index.html"
      - "dilution-calculator/index.html"
      - "tests/molarity-dilution.test.js"
      - "hed-calculator/index.html"
      - "tests/hed-calculator.test.js"
      - "protein-calculator/index.html"
      - "tests/protein-calculator.test.js"
      - "assets/main.js"
      - "outlier-detector/index.html"
      - "tests/outlier-detector.test.js"
      - ".github/workflows/survival-calculator-tests.yml"
  pull_request:
    paths:
      - "survival-calculator/main.js"
      - "tests/survival-calculator.test.js"
      - "chi-square-calculator/index.html"
      - "tests/chi-square-calculator.test.js"
      - "t-test-calculator/index.html"
      - "tests/t-test-calculator.test.js"
      - "molarity-calculator/index.html"
      - "dilution-calculator/index.html"
      - "tests/molarity-dilution.test.js"
      - "hed-calculator/index.html"
      - "tests/hed-calculator.test.js"
      - "protein-calculator/index.html"
      - "tests/protein-calculator.test.js"
      - "assets/main.js"
      - "outlier-detector/index.html"
      - "tests/outlier-detector.test.js"
      - ".github/workflows/survival-calculator-tests.yml"

jobs:
  calculator-regression-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/survival-calculator.test.js tests/chi-square-calculator.test.js tests/outlier-detector.test.js tests/t-test-calculator.test.js tests/molarity-dilution.test.js tests/hed-calculator.test.js tests/protein-calculator.test.js
